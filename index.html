<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一句">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>一句</title>
<script src="jszip.min.js"></script>
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#2a2622; --muted:#8a8178; --line:#e6dfd3;
  --accent:#b5562d; --accent-soft:#f3e3d8; --saved:#c7902a;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1916;--card:#24211d;--ink:#ece6dc;--muted:#9a9187;--line:#36312b;--accent:#e08a5f;--accent-soft:#3a2a20;--saved:#e0b04f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:72px}
header.top{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top))!important;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:2px}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:0;margin-left:8px;font-weight:400}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav.tabs .inner{max-width:620px;width:100%;display:flex}
nav.tabs button{flex:1;padding:12px 0 calc(12px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs svg{display:block;margin:0 auto 3px;width:22px;height:22px}
.post{background:var(--card);border-bottom:1px solid var(--line);padding:18px 18px 12px;display:flex;gap:12px}
.cover{flex:none;width:42px;height:60px;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18),inset -2px 0 0 rgba(0,0,0,.08);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:600;font-size:11px;line-height:1.25;text-align:center;padding:4px;word-break:break-all}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.big{width:64px;height:92px;font-size:14px;padding:6px}
.card .head{display:flex;gap:14px;align-items:flex-start}
.card .head .info{flex:1;min-width:0}
.post .avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:#fff;font-size:17px}
.post .body{flex:1;min-width:0}
.post .meta{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.post .meta b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.post .text{font-family:var(--serif);font-size:17px;line-height:1.8;margin:8px 0 10px;cursor:pointer;border-left:3px solid var(--accent-soft);padding-left:12px}
mark.q{background:var(--accent-soft);color:inherit;border-radius:3px;padding:1px 0;scroll-margin-top:90px}
.post.read .text{color:var(--muted)}
.post .actions{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.post .actions button{display:flex;align-items:center;gap:5px;padding:4px 0}
.post .actions svg{width:18px;height:18px}
.post .actions .saved{color:var(--saved)}
.end{text-align:center;padding:40px 24px;color:var(--muted);line-height:1.8}
.end .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
.btn{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:10px 20px;font-size:15px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.5}
.section{padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-family:var(--serif);font-size:17px}
.card p{margin:4px 0;color:var(--muted);font-size:13px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:120px;resize:vertical}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.notice button{color:var(--accent);font-size:12px;margin-left:6px}
.notice{font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 18px;line-height:1.6}
/* reader */
.reader{background:var(--bg);display:none;min-height:100vh}
.reader.open{display:block}
body.reading .app,body.reading nav.tabs{display:none}
.reader article{padding-bottom:calc(60px + env(safe-area-inset-bottom))!important}
.reader .bar{z-index:10}
.reader .bar{padding-top:calc(12px + env(safe-area-inset-top))!important;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px}
.reader .bar .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.reader article{max-width:640px;margin:0 auto;padding:22px 22px 60px;font-family:var(--serif);font-size:18px;line-height:1.95}
.reader article h2{font-size:22px;margin:10px 0 6px;line-height:1.5}
.reader article .hook{font-size:14px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0 22px;line-height:1.7;font-family:var(--sans)}
.reader article p{margin:0 0 1em;text-indent:2em}
.reader .chend{text-align:center;color:var(--muted);font-size:13px;font-family:var(--sans);margin:24px 0 36px}
.reader .next{text-align:center;padding:10px 0 40px}
.hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--saved) 45%,transparent) 55%);cursor:pointer}
.hl.has-note{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--accent) 35%,transparent) 55%)}
.hl.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--saved) 50%,transparent)}}
.seltool{position:fixed;z-index:30;display:none;background:var(--ink);color:var(--bg);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:hidden;font-size:14px}
.seltool.open{display:flex}
.seltool button{color:inherit;padding:10px 14px;border-right:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
.seltool button:last-child{border-right:0}
.note-card{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px}
.note-card .q{font-family:var(--serif);font-size:16px;line-height:1.8;border-left:3px solid var(--saved);padding-left:12px;cursor:pointer}
.note-card .n{margin:10px 0 0;font-size:14px;line-height:1.7;background:var(--accent-soft);border-radius:10px;padding:8px 12px;white-space:pre-wrap}
.note-card .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.note-card .m button{color:var(--muted);font-size:12px;padding:2px 0 2px 12px}
.book-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px;font-family:var(--serif);font-weight:600}
.book-h button{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--accent)}
.modal .box textarea{min-height:110px;margin:8px 0 14px}
.modal .box .quote{font-family:var(--serif);font-size:14px;color:var(--muted);line-height:1.7;max-height:120px;overflow:auto;border-left:3px solid var(--saved);padding-left:10px;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%}
.modal .box p{line-height:1.7;margin:0 0 16px}
.empty{padding:60px 28px;text-align:center;color:var(--muted);line-height:1.8}
.chlist{max-height:260px;overflow:auto;margin-top:8px;border-top:1px solid var(--line)}
.chlist button{display:block;width:100%;text-align:left;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">一句<small>每条帖子，都是一章书</small></div>
    <span class="pill" id="quota">今日 0/15</span>
  </header>
  <div id="storageNote" class="notice hidden"></div>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="inner">
  <button data-tab="feed" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>首页</button>
  <button data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>收藏</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>笔记</button>
  <button data-tab="shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-.8 3 15.6-3.5.8z"/></svg>书架</button>
</div></nav>

<div class="reader" id="reader">
  <div class="bar">
    <button id="rBack" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t" id="rTitle"></div>
    <button id="rSave" class="pill">收藏</button>
  </div>
  <article id="rBody"></article>
</div>

<div class="seltool" id="selTool"><button data-sel="hl">划线</button><button data-sel="note">写想法</button><button data-sel="copy">复制</button></div>
<div class="modal" id="noteModal"><div class="box"><div class="quote" id="nQuote"></div><textarea id="nText" placeholder="写下你的想法…"></textarea><div class="row" style="justify-content:space-between"><div><button class="btn ghost small hidden" id="nDel" style="color:var(--muted);border-color:var(--line)">删除划线</button></div><div style="display:flex;gap:8px"><button class="btn ghost small" id="nCancel">取消</button><button class="btn small" id="nOk">保存</button></div></div></div></div>
<div class="modal" id="modal"><div class="box"><p id="mText"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost small" id="mNo">取消</button><button class="btn small" id="mYes">确定</button></div></div></div>

<script>
/* ============ 存储层：优先云端 db（个人私有），否则本机 IndexedDB ============ */
const Store = {
  mode:'none', db:null, uid:null, idb:null,
  async init(){
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    try{ this.idb = await new Promise((res,rej)=>{ const r=indexedDB.open('yiju',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); this.mode='local'; }
    catch(e){ this.mode='memory'; this.mem=new Map(); }
  },
  async all(){
    if(this.mode!=='local') return [...this.mem.entries()];
    return new Promise((res)=>{const out=[];const r=this.idb.transaction('kv').objectStore('kv').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push([c.key,c.value]);c.continue();}else res(out);};});
  },
  col(){ return this.db.collection('data/users/'+this.uid); },
  async put(key,obj){
    if(this.mode==='cloud') return this.col().doc(key).set(obj);
    if(this.mode==='local') return new Promise((res,rej)=>{const t=this.idb.transaction('kv','readwrite');t.objectStore('kv').put(obj,key);t.oncomplete=res;t.onerror=()=>rej(t.error);});
    this.mem.set(key,obj);
  },
  async get(key){
    if(this.mode==='cloud'){ const s=await this.col().doc(key).get(); return s.exists?JSON.parse(JSON.stringify(s.data())):null; }
    if(this.mode==='local') return new Promise((res,rej)=>{const r=this.idb.transaction('kv').objectStore('kv').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});
    return this.mem.get(key)||null;
  },
  async del(key){
    if(this.mode==='cloud') return this.col().doc(key).delete();
    if(this.mode==='local') return new Promise((res)=>{const t=this.idb.transaction('kv','readwrite');t.objectStore('kv').delete(key);t.oncomplete=res;});
    this.mem.delete(key);
  },
  async list(kind){
    if(this.mode==='cloud'){ const s=await this.col().where('kind','==',kind).limit(1000).get(); return s.docs.map(d=>JSON.parse(JSON.stringify(d.data()))); }
    if(this.mode==='local') return new Promise((res)=>{const out=[];const r=this.idb.transaction('kv').objectStore('kv').openCursor();r.onsuccess=()=>{const c=r.result;if(c){if(c.value&&c.value.kind===kind)out.push(c.value);c.continue();}else res(out);};});
    return [...this.mem.values()].filter(v=>v.kind===kind);
  }
};
const LS = { get(k,d){try{const v=localStorage.getItem('yiju_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem('yiju_'+k,JSON.stringify(v));}catch(e){}} };

/* ============ 状态 ============ */
const S = { books:[], posts:[], hls:[], tab:'feed', busy:null };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#b5562d','#5d7a5a','#4a6a8a','#8a5a7a','#a0782f','#5a6f73','#7a5a44'];
const colorFor = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const today = () => new Date().toISOString().slice(0,10);
function seenToday(){ const v=LS.get('seen2',{d:'',ids:[]}); return v.d===today()?v.ids:[]; }
function markSeen(ids){ const cur=new Set(seenToday()); ids.forEach(i=>cur.add(i)); LS.set('seen2',{d:today(),ids:[...cur]}); }
const dailyCap = () => LS.get('cap',15);

/* ============ 导入与切分章节 ============ */
const CH_RE = /^[\s　]*((第[0-9０-９零〇一二三四五六七八九十百千万两]+[章回节卷篇部集幕].{0,30})|((Chapter|CHAPTER)\s+[0-9IVXLC]+.{0,40})|(序[章言]?|楔子|引子|前言|尾声|后记|番外.{0,20}))[\s　]*$/;
function splitTxt(text){
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const chs=[]; let cur=null;
  for(const ln of lines){
    if(CH_RE.test(ln) && ln.trim().length<=40){ if(cur) chs.push(cur); cur={title:ln.trim(),lines:[]}; }
    else { if(!cur) cur={title:'开篇',lines:[]}; cur.lines.push(ln); }
  }
  if(cur) chs.push(cur);
  let out=chs.map(c=>({title:c.title,text:c.lines.join('\n').trim()})).filter(c=>c.text.length>30);
  if(out.length<=1){ // 没有章节标记：按段落切成约 3000 字一节
    const paras=text.split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean); out=[]; let buf='';
    for(const p of paras){ buf+=(buf?'\n':'')+p; if(buf.length>3000){ out.push({title:'第'+(out.length+1)+'节',text:buf}); buf=''; } }
    if(buf) out.push({title:'第'+(out.length+1)+'节',text:buf});
  }
  return out;
}
function decodeTxt(buf){
  let t=new TextDecoder('utf-8').decode(buf);
  const bad=(t.match(/\uFFFD/g)||[]).length;
  if(bad>20){ try{ t=new TextDecoder('gb18030').decode(buf); }catch(e){} }
  return t;
}
function htmlToText(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style').forEach(n=>n.remove());
  const blocks=[...doc.body.querySelectorAll('p,h1,h2,h3,h4,div,li,blockquote')].filter(n=>!n.querySelector('p,div,li,blockquote'));
  const title=(doc.querySelector('h1,h2,h3')||{}).textContent;
  const text=(blocks.length?blocks.map(b=>b.textContent.trim()):[doc.body.textContent]).filter(Boolean).join('\n');
  return {title:title&&title.trim(), text:text.trim()};
}
async function parseEpub(file){
  const zip=await JSZip.loadAsync(file);
  const cont=await zip.file('META-INF/container.xml').async('string');
  const opfPath=cont.match(/full-path="([^"]+)"/)[1]; const base=opfPath.includes('/')?opfPath.replace(/[^/]+$/,''):'';
  const opf=new DOMParser().parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  const bookTitle=(opf.getElementsByTagName('dc:title')[0]||{}).textContent||file.name.replace(/\.epub$/i,'');
  const items={}; [...opf.getElementsByTagName('item')].forEach(i=>items[i.getAttribute('id')]=i.getAttribute('href'));
  const spine=[...opf.getElementsByTagName('itemref')].map(r=>items[r.getAttribute('idref')]).filter(Boolean);
  const chs=[];
  for(const href of spine){
    const f=zip.file(decodeURIComponent(base+href).replace(/#.*$/,'')) || zip.file(base+href);
    if(!f) continue;
    const {title,text}=htmlToText(await f.async('string'));
    if(text.length<200) continue; // 封面、版权页等
    chs.push({title:title||('第'+(chs.length+1)+'节'),text});
  }
  let cover=null; try{ cover=await epubCover(zip,opf,base,items); }catch(e){}
  return {title:bookTitle.trim(),chapters:chs,cover};
}
async function epubCover(zip,opf,base,items){
  const all=[...opf.getElementsByTagName('item')];
  let href=null;
  const prop=all.find(i=>/cover-image/.test(i.getAttribute('properties')||'')); if(prop) href=prop.getAttribute('href');
  if(!href){ const m=[...opf.getElementsByTagName('meta')].find(m=>m.getAttribute('name')==='cover'); if(m){ const id=m.getAttribute('content'); href=items[id]; } }
  if(!href){ const c=all.find(i=>/image\//.test(i.getAttribute('media-type')||'') && /cover/i.test((i.getAttribute('id')||'')+(i.getAttribute('href')||''))); if(c) href=c.getAttribute('href'); }
  if(!href){ const c=all.find(i=>/image\//.test(i.getAttribute('media-type')||'')); if(c) href=c.getAttribute('href'); }
  if(!href) return null;
  const f=zip.file(decodeURIComponent(base+href))||zip.file(base+href); if(!f) return null;
  const ext=(href.split('.').pop()||'').toLowerCase();
  const type=ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':ext==='svg'?'image/svg+xml':'image/jpeg';
  return shrinkImage(new Blob([await f.async('arraybuffer')],{type}));
}
// 缩成小图存起来（约 180px 宽），足够当头像和书架封面
function shrinkImage(blob){
  return new Promise((res)=>{
    const url=URL.createObjectURL(blob); const img=new Image();
    img.onload=()=>{ const W=180, sc=Math.min(1,W/img.naturalWidth); const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*sc)); c.height=Math.max(1,Math.round(img.naturalHeight*sc));
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); try{ res(c.toDataURL('image/jpeg',0.82)); }catch(e){ res(null); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
function coverHTML(book,title,big){
  const t=(book&&book.title)||title||'';
  if(book&&book.cover) return `<div class="cover${big?' big':''}"><img src="${book.cover}" alt=""></div>`;
  return `<div class="cover${big?' big':''}" style="background:linear-gradient(160deg,${colorFor(t)},color-mix(in srgb,${colorFor(t)} 70%,#000))">${esc(t.slice(0,big?8:4))}</div>`;
}
// 把太短的章节合并成一个“单元”，一条帖子覆盖一章或几章
function makeUnits(chs){
  const units=[]; let u=null;
  chs.forEach((c,i)=>{
    if(!u) u={start:i,end:i,len:0};
    u.end=i; u.len+=c.text.length;
    if(u.len>=1500 || u.end-u.start>=2){ units.push(u); u=null; }
  });
  if(u){ if(units.length && u.len<800){ const last=units[units.length-1]; last.end=u.end; last.len+=u.len; } else units.push(u); }
  return units;
}

const AI={ get(){ return Object.assign({key:'',base:'https://api.deepseek.com',model:'deepseek-v4-flash'},LS.get('ai',{})); }, set(v){ LS.set('ai',v); } };
async function aiFetch(path,opts){
  const c=AI.get();
  const r=await fetch(c.base.replace(/\/+$/,'')+path,Object.assign({},opts,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key}}));
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; try{ const j=await r.json(); e.detail=(j.error&&j.error.message)||''; }catch(_){} throw e; }
  return r.json();
}
async function callAI(prompt){
  const c=AI.get();
  const j=await aiFetch('/chat/completions',{method:'POST',body:JSON.stringify({model:c.model,temperature:0.7,response_format:{type:'json_object'},
    messages:[{role:'system',content:'你是一个眼光很好的中文文学编辑，只输出 JSON。'},{role:'user',content:prompt}]})});
  const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  return JSON.parse(txt.replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim());
}
function aiErrText(e){
  if(!e) return '';
  if(e.status===401||e.status===403) return 'API key 不对或已失效';
  if(e.status===402) return '账户余额不足';
  if(e.status===400&&/model/i.test(e.detail||'')) return '模型名不可用，去设置里点“测试连接”看看能用哪些';
  if(e.status) return '接口返回错误 '+e.status+(e.detail?'：'+e.detail:'');
  return '连不上接口（检查网络）';
}
const norm = s => s.replace(/[\s　]+/g,'');
const sentences = t => (t.replace(/\r/g,'').match(/[^。！？!?…\n]+[。！？!?…」”’"]*[」”’"]?/g)||[]).map(x=>x.trim()).filter(Boolean);
// 没有 Claude 时的兜底：按“像金句”的特征给句子打分
function pickLine(text){
  const ss=sentences(text); if(!ss.length) return text.slice(0,120);
  const score=(x,i)=>{ let sc=0; if(/[？?]/.test(x)) sc+=8; if(/[！!]/.test(x)) sc+=4; if(/[“「"]/.test(x)) sc+=6;
    if(/原来|竟然|从来|永远|忽然|突然|其实|不是|才|却|但是|然而/.test(x)) sc+=6; return sc; };
  let best=ss.slice(0,3).join(''), bs=-1e9;
  for(let i=0;i<ss.length;i++){ let w='', sc=0;
    for(let j=i;j<Math.min(ss.length,i+5);j++){ w+=ss[j]; sc+=score(ss[j],j); const L=w.length;
      if(L>=50&&L<=150){ const t=sc-Math.abs(L-100)/10-(i===0?8:0)+Math.sin(i*7.1)*2; if(t>bs){bs=t;best=w;} }
      if(L>150) break; } }
  return best;
}
// 校验 Claude 给的摘录确实出自原文；对不上的部分丢掉
function verifyQuote(q,full){
  if(!q||typeof q!=='string') return null;
  const F=norm(full); q=q.trim().replace(/^[“"「『]+|[”"」』]+$/g,'');
  if(q.length>=6 && F.includes(norm(q))) return q;
  const ok=sentences(q).filter(x=>x.length>=6 && F.includes(norm(x)));
  return ok.length? ok.join('') : null;
}
async function genPosts(book){
  const useAI=!!AI.get().key; S.aiErr='';
  const old={}; S.posts.filter(p=>p.bookId===book.id).forEach(p=>old[p.start]=p);
  const chs=[]; for(let i=0;i<book.count;i++){ chs.push({title:book.titles[i],text:await loadChapter(book.id,i)}); }
  const us=makeUnits(chs);
  const BATCH=3; let done=0;
  for(let b=0;b<us.length;b+=BATCH){
    const group=us.slice(b,b+BATCH);
    const full=group.map(u=>chs.slice(u.start,u.end+1).map(c=>c.text).join('\n'));
    const payload=group.map((u,k)=>{
      const txt=chs.slice(u.start,u.end+1).map(c=>'【'+c.title+'】\n'+c.text).join('\n\n');
      const clip=txt.length>9000? txt.slice(0,9000)+'\n（后略）' : txt;
      return `<unit n="${k}">\n${clip}\n</unit>`;
    }).join('\n');
    let lines=null;
    if(useAI && !S.aiErr){
      const prompt=`下面是《${book.title}》的若干单元（每个单元是一章或几章）。这些摘录会作为读书 App 信息流里的“帖子”，唯一的目的：让一个正想刷手机的人被勾住，忍不住点开读这一章。\n\n请为每个单元从原文中摘出最有吸引力的一段：\n- 一字不改地照抄原文里连续的一段，可以是 2～6 句，总长 50～150 字（手机上三四行）。宁可多带一两句上下文，让它自成一个小场景，也不要只剩一句干巴巴的话\n- 先在心里比较这一单元里的几个候选段落，再选最强的那段。好的摘录通常有：一个具体的场景或细节、一句有劲的对白、一个反常或反直觉的判断、一个悬而未决的冲突、一个让人心里一动的比喻\n- 不要选：章节开头的铺垫和交代、平铺直叙的过渡、泛泛的道理、目录注释，也不要把本章的结局揭穿\n- 读起来要像一条让人停下来的动态：最好结尾留一点“然后呢？”\n- 不要加引号、省略号或任何评论\n只输出 JSON：{"posts":["单元0的摘录","单元1的摘录"]}，数量必须等于 ${group.length}。\n\n${payload}`;
      for(let attempt=0;attempt<2 && !lines;attempt++){
        try{
          const r=await callAI(prompt);
          if(r && Array.isArray(r.posts)) lines=r.posts;
        }catch(e){
          if(e && e.status===429){ setBusy('请求太频繁，稍等一下…'); await new Promise(r=>setTimeout(r,8000)); }
          else if(e instanceof SyntaxError){ /* 返回的不是合法 JSON，重试一次 */ }
          else { S.aiErr=aiErrText(e); break; }
        }
      }
    }
    for(let k=0;k<group.length;k++){
      const u=group[k];
      const q=lines? verifyQuote(lines[k],full[k]) : null;
      const line=q || pickLine(full[k]);
      const label= u.start===u.end ? chs[u.start].title : `${chs[u.start].title} – ${chs[u.end].title}`;
      const prev=old[u.start];
      const post={kind:'post',id:prev?prev.id:uid(),bookId:book.id,bookTitle:book.title,start:u.start,end:u.end,label,text:line,quote:true,ai:!!q,saved:prev?prev.saved:false,savedAt:prev?prev.savedAt:0,read:prev?prev.read:false,createdAt:prev?prev.createdAt:Date.now()+b+k};
      await Store.put('po_'+post.id,post);
      S.posts=S.posts.filter(p=>p.id!==post.id); S.posts.push(post); delete old[u.start];
    }
    done+=group.length; setBusy(`挑选金句 ${done}/${us.length}`, 0.3+0.7*done/us.length);
  }
  for(const p of Object.values(old)){ await Store.del('po_'+p.id); S.posts=S.posts.filter(x=>x.id!==p.id); }
}

// 混排：每本书按剩余条数加权随机抽取，尽量不让同一本书连着出现
function shuffleMix(posts){
  const byBook={}; posts.forEach(p=>(byBook[p.bookId]=byBook[p.bookId]||[]).push(p));
  for(const a of Object.values(byBook)) for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  const out=[]; let last=null;
  while(true){
    const ks=Object.keys(byBook).filter(k=>byBook[k].length); if(!ks.length) break;
    let pool=ks.length>1? ks.filter(k=>k!==last) : ks;
    let r=Math.random()*pool.reduce((t,k)=>t+byBook[k].length,0), pick=pool[0];
    for(const k of pool){ r-=byBook[k].length; if(r<=0){ pick=k; break; } }
    out.push(byBook[pick].shift().id); last=pick;
  }
  return out;
}

  if(!o || o.d!==today() || S.posts.some(p=>!o.ids.includes(p.id))){ reshuffle(); o=LS.get('order',null)||{ids:shuffleMix(S.posts)}; }

  return o.ids.filter(id=>ids.has(id)).map(id=>byId[id]);
}

const readSet = b => new Set(b.read||[]);
let readObs=null, bookSaving=Promise.resolve();
function watchRead(el,i){
  if(!readObs) readObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ readObs.unobserve(e.target); markChapterRead(R.book,+e.target.dataset.ci); } }),{root:null,threshold:0});
  el.dataset.ci=i; readObs.observe(el);
}
function markChapterRead(book,i){
  const rs=readSet(book); if(rs.has(i)) return;
  rs.add(i); book.read=[...rs].sort((a,b)=>a-b);
  // 一条帖子覆盖的章节全部读完，帖子才算已读
  for(const p of S.posts) if(p.bookId===book.id && !p.read && i>=p.start && i<=p.end){
    let all=true; for(let k=p.start;k<=p.end;k++) if(!rs.has(k)) all=false;
    if(all){ p.read=true; Store.put('po_'+p.id,p).catch(()=>{}); }
  }
  const snapshot={...book}; bookSaving=bookSaving.then(()=>Store.put('bk_'+book.id,snapshot)).catch(()=>{});
}
async function appendChapter(i){
  const text=await loadChapter(R.book.id,i);
  const paras=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const sec=document.createElement('section');
  const q=R.post&&R.post.quote?R.post.text:null;
  sec.innerHTML=`<h2>${esc(R.book.titles[i])}</h2>`+paras.map(p=>`<p>${markQuote(p,q)}</p>`).join('')+`<div class="chend">${readSet(R.book).has(i)?'✓ 已读':'— 本章完 —'}</div>`;
  sec.dataset.ci=i; $('#rBody').appendChild(sec); R.next=i+1; watchRead(sec.querySelector('.chend'),i);
  S.hls.filter(h=>h.bookId===R.book.id&&h.ch===i).forEach(h=>paintHl(sec,h));

/* ======== 划线 / 想法 ======== */
// 位置用「第几段 + 段内第几个字」记录，不受高亮标签影响
function posIn(sec,node,off){
  const p=(node.nodeType===1?node:node.parentElement).closest('p'); if(!p||!sec.contains(p)) return null;
  const ps=[...sec.querySelectorAll('p')]; const pi=ps.indexOf(p);
  const r=document.createRange(); r.selectNodeContents(p); r.setEnd(node,off);
  return {p:pi,o:r.toString().length};
}
function selInfo(){
  const sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
  const rg=sel.getRangeAt(0); const text=sel.toString().trim(); if(text.length<2) return null;
  const sa=(rg.startContainer.nodeType===1?rg.startContainer:rg.startContainer.parentElement).closest('#rBody section');
  const sb=(rg.endContainer.nodeType===1?rg.endContainer:rg.endContainer.parentElement).closest('#rBody section');
  if(!sa||sa!==sb) return null; // 不支持跨章
  let a=posIn(sa,rg.startContainer,rg.startOffset), b=posIn(sa,rg.endContainer,rg.endOffset);
  if(!a){ a={p:0,o:0}; } if(!b) return null;
  return {sec:sa,ch:+sa.dataset.ci,pS:a.p,oS:a.o,pE:b.p,oE:b.o,text:sel.toString().replace(/\s*\n\s*/g,'\n').trim(),rect:rg.getBoundingClientRect()};
}
function wrapText(p,from,to,cls,id){
  if(to<=from) return;
  const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT); let pos=0, n; const segs=[];
  while((n=w.nextNode())){ const L=n.data.length, s0=Math.max(from,pos), e0=Math.min(to,pos+L); if(s0<e0) segs.push([n,s0-pos,e0-pos]); pos+=L; }
  for(const [node,a,b] of segs){
    let t=node; if(a>0) t=t.splitText(a); if(b-a<t.data.length) t.splitText(b-a);
    const sp=document.createElement('span'); sp.className=cls; sp.dataset.hl=id; t.parentNode.insertBefore(sp,t); sp.appendChild(t);
  }
}
function paintHl(sec,h){
  const ps=sec.querySelectorAll('p');
  for(let i=h.pS;i<=h.pE&&i<ps.length;i++){
    const len=ps[i].textContent.length;
    wrapText(ps[i], i===h.pS?h.oS:0, i===h.pE?Math.min(h.oE,len):len, 'hl'+(h.note?' has-note':''), h.id);
  }
}
function unpaintHl(id){ document.querySelectorAll(`#rBody .hl[data-hl="${id}"]`).forEach(sp=>{ const p=sp.parentNode; while(sp.firstChild) p.insertBefore(sp.firstChild,sp); sp.remove(); p.normalize(); }); }
function repaintHl(h){ unpaintHl(h.id); const sec=document.querySelector(`#rBody section[data-ci="${h.ch}"]`); if(sec) paintHl(sec,h); }

/* 示例书：为演示而写的原创短文 */
const DEMO={title:'慢下来（示例）',chapters:[
 {title:'第一章 二十分钟',text:'每天早上醒来，第一件事是伸手去摸手机。等回过神来，二十分钟已经过去，脑子里塞满了别人的早餐、别人的争吵、别人的旅行。\n那二十分钟没有留下任何东西。说不上快乐，也说不上难过，只是一种被轻轻推着往前走的感觉，像站在一条传送带上。\n有一天我试着数了数：一个上午，我解锁手机四十一次。大多数时候，我并不知道自己想看什么，只是手指需要一个地方落下。\n于是我想，也许问题不在于看什么，而在于这种“随时可以再滑一下”的结构本身。'},
 {title:'第二章 一句话的诱饵',text:'信息流之所以让人停不下来，是因为每一条都很短，短到你觉得“再看一条也不费事”。\n但如果每一条短短的句子背后，都连着一整章值得读完的文字呢？那条句子就不再是终点，而是一扇门。\n我开始把读过的书一章一章拆开，给每一章写一句话。写的时候才发现，能用一句话说清楚的章节，往往是真正读懂了的章节。\n点开那句话，就回到这一章的第一页。想读就读下去，不想读就收藏起来，等晚上再说。'},
 {title:'第三章 刷完就停',text:'真正的改变来自一个小小的限制：一天只给自己十五条。\n第十五条之后，屏幕上只会出现一句话：今天就刷到这里。没有“为你推荐”，没有下拉刷新，没有无限的下一页。\n起初很不习惯，手指还会习惯性地往下拉。可是几天之后，我发现自己开始在那十五条里挑选，挑出一条最想读的，然后真的把那一章读完了。\n原来让人放下手机的，不是意志力，而是一个会结束的页面。'}
]};

/* ============ 启动 ============ */
(async function(){
  render();
  await Store.init();
  const note=$('#storageNote');
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(!standalone && !LS.get('hideInstall',false)){ note.innerHTML='建议先把「一句」添加到主屏幕再导入书：iPhone 上主屏幕图标和 Safari 的数据是分开存的。<button id="hideInstall">知道了</button>'; note.classList.remove('hidden'); }
  if(Store.mode==='memory'){ note.textContent='当前环境无法保存数据，关闭页面后会丢失。'; note.classList.remove('hidden'); }
  try{ const [books,posts]=await Promise.all([Store.list('book'),Store.list('post')]); S.books=books; S.posts=posts; S.hls=await Store.list('hl');
    // 旧版本只记了帖子已读：把它们覆盖的章节补进书的已读记录
    for(const b of S.books) if(!b.read){ const rs=new Set(); S.posts.filter(p=>p.bookId===b.id&&p.read).forEach(p=>{for(let k=p.start;k<=p.end;k++)rs.add(k);}); b.read=[...rs]; }
  }catch(e){}
  render();
})();
document.addEventListener('click',e=>{ if(e.target.id==='hideInstall'){ LS.set('hideInstall',true); $('#storageNote').classList.add('hidden'); } });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
